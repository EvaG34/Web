<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 6</title>
</head>
<body>
    <script>
        let price = parseFloat(prompt("Enter purchase amount", 250));
        let discount;

        if(price >= 200 && price < 300){
            discount = 3;
        }
        else if(price >= 300 && price < 500){
            discount = 5;
        }
        else if(price >= 500){
            discount = 7;
        }
        else{
            discount = 0;
        }

        let result = price - (price * discount / 100);

        alert("К оплате: " + result);
    </script>
</body>
</html>
