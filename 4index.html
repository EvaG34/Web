<body>
    <script>
        let year = parseInt(prompt("Enter year", 2024));

        if(year % 400 === 0 || (year % 4 === 0 && year % 100 !== 0)){
            alert("Високосный год");
        }
        else{
            alert("Не високосный год");
        }
    </script>
