<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2</title>
</head>
<body>
    <script>
        let number = parseInt(prompt("Enter number from 0 to 9", 1));

        switch(number){
            case 1:
                alert("!");
                break;
            case 2:
                alert("@");
                break;
            case 3:
                alert("#");
                break;
            case 4:
                alert("$");
                break;
            case 5:
                alert("%");
                break;
            case 6:
                alert("^");
                break;
            case 7:
                alert("&");
                break;
            case 8:
                alert("*");
                break;
            case 9:
                alert("(");
                break;
            case 0:
                alert(")");
                break;
            default:
                alert("Неверное число");
        }
    </script>
</body>
</html>
