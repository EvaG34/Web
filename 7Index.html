<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 7</title>
</head>
<body>
    <script>
        let circle = parseFloat(prompt("Enter circle length", 20));
        let square = parseFloat(prompt("Enter square perimeter", 30));

        if(circle <= square){
            alert("Окружность поместится в квадрат");
        }
        else{
            alert("Окружность не поместится в квадрат");
        }
    </script>
</body>
</html>
