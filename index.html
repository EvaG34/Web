<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
</head>
<body>
    <script>
        let age = parseInt(prompt("Enter your age", 17));

        if(age >= 0 && age <= 2){
            alert("Ребенок");
        }
        else if(age >= 12 && age < 18){
            alert("Подросток");
        }
        else if(age >= 18 && age < 60){
            alert("Взрослый");
        }
        else if(age >= 60){
            alert("Пенсионер");
        }
        else{
            alert("Неверный возраст");
        }
    </script>
</body>
</html>
